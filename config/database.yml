production:
  # This single block handles everything for the production environment
  primary:
    adapter: postgresql
    encoding: unicode
    url: <%= ENV["DATABASE_URL"] %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  
  cache:
    adapter: postgresql
    database: picalica_production_cache
    migrations_paths: db/cache_migrate
    url: <%= ENV["CACHE_DATABASE_URL"] %>
    
  queue:
    adapter: postgresql
    database: picalica_production_queue
    migrations_paths: db/queue_migrate
    url: <%= ENV["QUEUE_DATABASE_URL"] %>
    
  cable:
    adapter: postgresql
    database: picalica_production_cable
    migrations_paths: db/cable_migrate
    url: <%= ENV["CABLE_DATABASE_URL"] %>