databases:
  - name: picalica
    # ipAllowList: []
    databaseName: my_app_render
    user: my_app_render
    plan: free

services:
  - type: web
    name: my_app_render
    env: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rails server"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: picalica
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: 2